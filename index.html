<style>

:root[data-theme="dark"]{--bg:#0F1330;--surf:#181E47;--ink:#E8EBFA;--mute:#98A2D6;--line:#2A3266;--soft:#222A5C;--side:#0B0E27;--blue:#7E8CE0;--chip:#2A3266;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Arial,sans-serif;display:flex;min-height:100vh}

h1{font-size:24px;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 14px}

.wrap{overflow-x:auto}

th{text-align:left;font-size:13px;color:var(--mute);padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.empty{padding:28px 10px;text-align:center;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{border-left:5px solid var(--blue)}.kpi b{display:block;font-size:28px}
.steps{margin:0;padding-left:20px}.steps li{margin:8px 0}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;padding:0}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13px;background:var(--chip)}
.chip.red{background:var(--red);color:#fff}.chip.blue{background:var(--blue);color:#fff}
:root[data-theme="dark"] .chip.blue{color:#0F1330}
dialog{border:0;border-radius:14px;max-width:560px;width:calc(100% - 24px);max-height:92vh;overflow:auto;background:var(--surf);color:var(--ink);padding:20px}
dialog::backdrop{background:rgba(10,14,40,.55)}
dialog h2{margin:0 0 8px;font-size:20px}
.fl{display:block;font-weight:600;margin:14px 0 4px}
.rq{color:var(--red)}
.hint{font-size:13px;color:var(--mute);margin-top:3px}
.err{border-left:4px solid var(--red);background:var(--soft);padding:8px 12px;margin-top:14px;border-radius:6px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.mv{padding:8px 0;border-bottom:1px solid var(--line)}
#login{margin:auto;width:min(400px,92vw)}
#login img{display:block;margin:0 auto 14px;max-width:100%}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
.toast.on{opacity:1}
.hide{display:none!important}
.pw{position:relative}.pw input{padding-right:50px}
.eye{position:absolute;right:2px;top:2px;width:44px;height:40px;background:none;border:0;cursor:pointer;color:var(--mute);display:grid;place-items:center}
.eye .sl{display:none}.eye.on .sl{display:inline}
@media (max-width:820px){
aside{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s}
body.open aside{transform:none}
main{padding:0 12px 40px}h1{font-size:21px}.top .who{display:none}
.scrim{position:fixed;inset:0;background:rgba(10,14,40,.5);z-index:15;display:none}body.open .scrim{display:block}}
</style>
</head>
