<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masters Gestão</title>
<style>
:root{--blue:#313E86;--red:#FC0A0B;--bg:#EEF1F8;--surf:#fff;--ink:#1B2252;--mute:#5E678F;--line:#C9D0E8;--soft:#E3E8F6;--side:#313E86;--chip:#E3E8F6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1330;--surf:#181E47;--ink:#E8EBFA;--mute:#98A2D6;--line:#2A3266;--soft:#222A5C;--side:#0B0E27;--blue:#7E8CE0;--chip:#2A3266;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1330;--surf:#181E47;--ink:#E8EBFA;--mute:#98A2D6;--line:#2A3266;--soft:#222A5C;--side:#0B0E27;--blue:#7E8CE0;--chip:#2A3266;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Arial,sans-serif;display:flex;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
aside{width:250px;background:var(--side);color:#fff;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:20}
.lg{display:block;background:#fff;border-radius:8px;padding:4px 6px;height:46px;width:226px;object-fit:contain;margin:16px 12px}
aside h4{margin:14px 18px 4px;font-size:13px;font-weight:600;color:#AEB7E3}
.nav{display:block;width:100%;padding:11px 18px;background:none;border:0;border-left:4px solid transparent;color:#E6E9F8;text-align:left;cursor:pointer}
.nav:hover{background:rgba(255,255,255,.08)}
.nav.on{background:rgba(255,255,255,.14);border-left-color:var(--red);color:#fff;font-weight:600}
.soon{padding:8px 18px;color:#AEB7E3;font-size:14px}
main{flex:1;min-width:0;padding:0 22px 40px}
.top{position:sticky;top:0;background:var(--bg);display:flex;gap:10px;align-items:center;padding:12px 0;z-index:10}
.top .who{margin-left:auto;text-align:right;font-size:13px;color:var(--mute);line-height:1.25}
.ico,.sec{background:var(--surf);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}
.ico{width:44px;padding:0}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;min-height:44px;padding:0 18px;font-weight:600;cursor:pointer}
:root[data-theme="dark"] .btn{color:#0F1330}
.btn:disabled{opacity:.6;cursor:wait}
.mini{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surf);cursor:pointer;margin-right:6px}
h1{font-size:24px;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.bar input{flex:1;min-width:180px}
input,select,textarea{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surf)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:13px;color:var(--mute);padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.empty{padding:28px 10px;text-align:center;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{border-left:5px solid var(--blue)}.kpi b{display:block;font-size:28px}
.steps{margin:0;padding-left:20px}.steps li{margin:8px 0}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;padding:0}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13px;background:var(--chip)}
.chip.red{background:var(--red);color:#fff}.chip.blue{background:var(--blue);color:#fff}
:root[data-theme="dark"] .chip.blue{color:#0F1330}
dialog{border:0;border-radius:14px;max-width:560px;width:calc(100% - 24px);max-height:92vh;overflow:auto;background:var(--surf);color:var(--ink);padding:20px}
dialog::backdrop{background:rgba(10,14,40,.55)}
dialog h2{margin:0 0 8px;font-size:20px}
.fl{display:block;font-weight:600;margin:14px 0 4px}
.rq{color:var(--red)}
.hint{font-size:13px;color:var(--mute);margin-top:3px}
.err{border-left:4px solid var(--red);background:var(--soft);padding:8px 12px;margin-top:14px;border-radius:6px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.mv{padding:8px 0;border-bottom:1px solid var(--line)}
#login{margin:auto;width:min(400px,92vw)}
#login img{display:block;margin:0 auto 14px;max-width:100%}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
.toast.on{opacity:1}
.hide{display:none!important}
.pw{position:relative}.pw input{padding-right:50px}
.eye{position:absolute;right:2px;top:2px;width:44px;height:40px;background:none;border:0;cursor:pointer;color:var(--mute);display:grid;place-items:center}
.eye .sl{display:none}.eye.on .sl{display:inline}
@media (max-width:820px){
aside{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s}
body.open aside{transform:none}
main{padding:0 12px 40px}h1{font-size:21px}.top .who{display:none}
.scrim{position:fixed;inset:0;background:rgba(10,14,40,.5);z-index:15;display:none}body.open .scrim{display:block}}
</style>
</head>
<body>
<div id="login" class="card hide">
 <img src="assets/logo.png" alt="Masters Engenharia" height="70">
 <h1 style="text-align:center">Entrar no Masters Gestão</h1>
 <form id="lf">
  <label class="fl" for="em">Usuário <b class="rq">*</b></label><input id="em" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required><div class="hint">Digite só o seu usuário, sem e-mail.</div>
  <label class="fl" for="pw">Senha <b class="rq">*</b></label><div class="pw" id="pwbox"><input id="pw" type="password" autocomplete="current-password" required></div>
  <div class="err hide" id="le"></div>
  <div class="acts"><button class="btn" id="lb" style="width:100%">Entrar</button></div>
  <div style="text-align:center;margin-top:14px"><button type="button" class="link" id="fg">Esqueci minha senha</button></div>
 </form>
</div>

<aside id="side" class="hide"><img class="lg" src="assets/logo.png" alt="Masters Engenharia"><div id="menu"></div><div class="soon" style="margin-top:14px">Versão 3B-5c</div></aside>
<div class="scrim" id="scrim"></div>
<main id="app" class="hide">
 <div class="top">
  <button class="ico" id="mb" aria-label="Abrir menu">☰</button>
  <button class="ico" id="th" aria-label="Alternar modo claro e escuro">◐</button>
  <div class="who" id="who"></div>
  <button class="sec" id="mp">Minha senha</button>
  <button class="sec" id="out">Sair</button>
 </div>
 <div id="view"></div>
</main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://ruhszeqebmngpmahwkvk.supabase.co',SB_KEY='sb_publishable_PejdDMttoQYXx_xOzwiuag_cjy_azOe';
const $=s=>document.querySelector(s),R=document.documentElement;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb,me=null,cache={},cur='painel';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2800)}
function msg(e){const c=e.code,m=e.message||'';
 if(c==='23505')return 'Já existe um cadastro com este código, número ou identificação. Confira antes de gravar.';
 if(c==='23503')return 'Escolha um valor válido nas listas.';
 if(c==='23514'||c==='23502')return 'Há campo obrigatório vazio ou valor inválido.';
 if(c==='42501'||/row-level security/i.test(m))return 'Você não tem permissão para esta ação nesta obra.';
 if(/fetch|network|load failed/i.test(m))return 'Sem conexão com a internet. Nada foi gravado.';
 return m}

/* ===== o que cada cadastro contém ===== */
const SIT=['Ativo','Afastado','Desligado'];
const E={
obras:{p:'Obras',btn:'Cadastrar obra',vazio:'Nenhuma obra cadastrada ainda.',adm:1,cols:['codigo','nome','responsavel','status'],f:[
 {k:'codigo',l:'Código da obra',r:1,h:'Código interno usado pela Masters.'},
 {k:'nome',l:'Nome da obra',r:1},{k:'endereco',l:'Endereço'},{k:'responsavel',l:'Responsável'},{k:'encarregado',l:'Encarregado'},
 {k:'data_inicio',l:'Data de início',t:'date'},{k:'status',l:'Situação',t:'sel',o:['Ativa','Pausada','Concluída'],d:'Ativa'}]},
disciplinas:{p:'Disciplinas',btn:'Cadastrar disciplina',vazio:'Nenhuma disciplina cadastrada ainda.',adm:1,cols:['nome','ativo'],f:[
 {k:'nome',l:'Nome da disciplina',r:1,h:'Área de trabalho do profissional.'},{k:'ativo',l:'Disponível para uso',t:'bool',d:true}]},
categorias:{p:'Categorias',btn:'Cadastrar categoria',vazio:'Nenhuma categoria cadastrada ainda.',cols:['tipo','nome'],f:[
 {k:'tipo',l:'Para que serve',r:1,t:'sel',o:['Ferramenta','Material'],d:'Ferramenta'},{k:'nome',l:'Nome da categoria',r:1}]},
funcionarios:{p:'Funcionários',btn:'Cadastrar funcionário',vazio:'Nenhum funcionário cadastrado ainda.',cols:['matricula','nome','obra_id','situacao'],f:[
 {k:'matricula',l:'Matrícula ou identificação',r:1,h:'Não pode repetir.'},{k:'nome',l:'Nome completo',r:1},
 {k:'obra_id',l:'Obra',r:1,t:'ref',ref:'obras',lab:'nome'},
 {k:'disciplina_id',l:'Disciplina ou função',t:'ref',ref:'disciplinas',lab:'nome'},{k:'cargo',l:'Cargo'},
 {k:'encarregado_id',l:'Encarregado',t:'ref',ref:'funcionarios',lab:'nome'},
 {k:'situacao',l:'Situação',t:'sel',o:SIT,d:'Ativo',h:'Funcionário não precisa ter login para existir aqui.'}]},
fornecedores:{p:'Fornecedores',btn:'Cadastrar fornecedor',vazio:'Nenhum fornecedor cadastrado ainda.',cols:['nome','cnpj','contato'],f:[
 {k:'nome',l:'Nome do fornecedor',r:1},{k:'cnpj',l:'CNPJ'},{k:'contato',l:'Contato (telefone ou e-mail)'},{k:'ativo',l:'Disponível para uso',t:'bool',d:true}]},
materiais:{p:'Materiais',btn:'Cadastrar material',vazio:'Nenhum material cadastrado ainda.',cols:['codigo','descricao','unidade','categoria_id'],f:[
 {k:'codigo',l:'Código do material',r:1,h:'Não pode repetir.'},{k:'descricao',l:'Descrição',r:1},
 {k:'categoria_id',l:'Categoria',t:'ref',ref:'categorias',lab:'nome',w:['tipo','Material']},
 {k:'unidade',l:'Unidade de medida',r:1,h:'Como o material é contado: metro, peça, caixa...'},
 {k:'estoque_minimo',l:'Estoque mínimo',t:'num',h:'O sistema avisará quando ficar abaixo disso.'},{k:'ativo',l:'Disponível para uso',t:'bool',d:true}]},
ferramentas:{p:'Ferramentas',btn:'Cadastrar ferramenta',vazio:'Nenhuma ferramenta cadastrada ainda.',cols:['codigo_patrimonial','nome','obra_id','situacao'],f:[
 {k:'codigo_patrimonial',l:'Código de identificação (patrimônio)',r:1,h:'Não pode repetir.'},{k:'nome',l:'Nome da ferramenta',r:1},{k:'descricao',l:'Descrição',t:'area'},
 {k:'categoria_id',l:'Categoria',t:'ref',ref:'categorias',lab:'nome',w:['tipo','Ferramenta']},{k:'marca',l:'Marca'},{k:'modelo',l:'Modelo'},
 {k:'numero_serie',l:'Número de série',h:'Preencha se houver.'},{k:'valor_aquisicao',l:'Valor de aquisição (R$)',t:'num'},{k:'data_aquisicao',l:'Data de aquisição',t:'date'},
 {k:'conservacao',l:'Estado de conservação',t:'sel',o:['Novo','Bom','Regular','Ruim'],d:'Bom'},
 {k:'obra_id',l:'Obra',r:1,t:'ref',ref:'obras',lab:'nome'},{k:'localizacao',l:'Localização na obra'},
 {k:'situacao',l:'Situação atual',t:'sel',o:['Disponível','Em manutenção','Extraviada','Baixada'],d:'Disponível',h:'Para retirar ou devolver, use os botões da lista.'}]}
};
const rk=f=>f.ref+(f.w?f.w.join(':'):'');
const canW=e=>me&&(e.adm?me.perfil==='MASTERS':me.perfil!=='FUNCIONARIO');
async function loadRefs(fs){for(const f of fs.filter(f=>f.t==='ref')){const k=rk(f);if(!cache[k]){let q=sb.from(f.ref).select('*').order(f.lab);if(f.w)q=q.eq(f.w[0],f.w[1]);const{data}=await q;cache[k]=data||[]}}}
function cell(f,v){if(v==null||v==='')return '—';
 if(f.t==='ref'){const r=(cache[rk(f)]||[]).find(x=>x.id===v);return esc(r?r[f.lab]:'—')}
 if(f.t==='date')return new Date(v+'T00:00').toLocaleDateString('pt-BR');
 if(f.t==='bool')return v?'Sim':'Não';
 if(f.k==='situacao'||f.k==='status'){const c=/Extraviada|Baixada|Desligado/.test(v)?'red':/Em uso|Ativ|Dispon/.test(v)?'blue':'';return `<span class="chip ${c}">${esc(v)}</span>`}
 return esc(v)}

/* ===== janela de formulário ===== */
function modal(title,html,ok,fn){const d=$('#dlg');
 d.innerHTML=`<h2>${title}</h2><div>${html}</div><div class="err hide" id="me"></div><div class="acts"><button class="sec" type="button" id="mc">${ok?'Cancelar':'Fechar'}</button>${ok?`<button class="btn" type="button" id="mo">${ok}</button>`:''}</div>`;
 d.showModal();$('#mc').onclick=()=>d.close();
 if(ok)$('#mo').onclick=async()=>{const b=$('#mo');b.disabled=true;let er;try{er=await fn()}catch(x){er=msg(x)}
  if(er){$('#me').textContent=er;$('#me').classList.remove('hide');b.disabled=false}else d.close()}}
function fld(f,row){let v=row?row[f.k]:f.d;if(v==null)v='';const id='f_'+f.k;let i;
 if(f.t==='sel')i=`<select id="${id}">${f.o.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
 else if(f.t==='ref'){const L=cache[rk(f)]||[];i=`<select id="${id}"><option value="">Selecione…</option>${L.map(o=>`<option value="${o.id}" ${o.id===v?'selected':''}>${esc(o[f.lab])}</option>`).join('')}</select>`+(L.length?'':`<div class="hint" style="color:var(--red)">Nenhuma opção ainda. Cadastre primeiro em ${E[f.ref].p}.</div>`)}
 else if(f.t==='bool')i=`<input id="${id}" type="checkbox" style="width:24px;min-height:24px" ${v?'checked':''}>`;
 else if(f.t==='area')i=`<textarea id="${id}" rows="3">${esc(v)}</textarea>`;
 else i=`<input id="${id}" type="${f.t==='date'?'date':f.t==='num'?'number':'text'}" ${f.t==='num'?'step="any" min="0" inputmode="decimal"':''} value="${esc(v)}">`;
 return `<label class="fl" for="${id}">${f.l}${f.r?' <b class="rq">*</b>':''}</label>${i}${f.h?`<div class="hint">${f.h}</div>`:''}`}
async function form(name,row){const e=E[name];await loadRefs(e.f);
 const fs=e.f.filter(f=>!(f.k==='situacao'&&row&&row.situacao==='Em uso'));
 modal(row?'Editar':e.btn,'<div class="hint">Os campos com <b class="rq">*</b> são obrigatórios.</div>'+fs.map(f=>fld(f,row)).join(''),row?'Salvar alterações':'Gravar cadastro',async()=>{
  const v={},falta=[];
  for(const f of fs){const el=$('#f_'+f.k);let x=f.t==='bool'?el.checked:el.value.trim();if(x===''){if(f.r)falta.push(f.l);x=null}else if(f.t==='num')x=Number(x);v[f.k]=x}
  if(falta.length)return 'Falta preencher: '+falta.join(', ')+'.';
  if(row&&!confirm('Salvar as alterações deste cadastro?'))return 'Nada foi alterado.';
  const{error}=row?await sb.from(name).update(v).eq('id',row.id):await sb.from(name).insert(v);
  if(error)return msg(error);
  cache={};toast(row?'Alterações salvas.':'Cadastro gravado.');show(name)})}

/* ===== ferramentas: retirar, devolver, histórico ===== */
async function retirar(r){const{data}=await sb.from('funcionarios').select('id,nome,matricula').eq('obra_id',r.obra_id).eq('situacao','Ativo').order('nome');
 if(!data||!data.length){toast('Cadastre antes um funcionário ativo desta obra.');return}
 modal('Retirar: '+esc(r.nome),`<label class="fl" for="rf">Quem está retirando? <b class="rq">*</b></label><select id="rf"><option value="">Selecione…</option>${data.map(x=>`<option value="${x.id}">${esc(x.nome)} (${esc(x.matricula)})</option>`).join('')}</select><label class="fl" for="ro">Observação</label><input id="ro">`,'Confirmar retirada',async()=>{
  const p=$('#rf').value;if(!p)return 'Escolha quem está retirando.';
  if(!confirm('Confirmar a retirada desta ferramenta?'))return 'Nada foi gravado.';
  const{error}=await sb.rpc('retirar_ferramenta',{p_ferramenta:r.id,p_funcionario:p,p_obs:$('#ro').value.trim()||null});
  if(error)return msg(error);toast('Retirada registrada.');show('ferramentas')})}
async function devolver(r){if(!confirm('Confirmar a devolução de "'+r.nome+'"?'))return;
 const{error}=await sb.rpc('devolver_ferramenta',{p_ferramenta:r.id,p_obs:null});
 if(error)toast(msg(error));else{toast('Devolução registrada.');show('ferramentas')}}
async function hist(r){await loadRefs([{t:'ref',ref:'funcionarios',lab:'nome'}]);
 const{data,error}=await sb.from('ferramenta_movs').select('*').eq('ferramenta_id',r.id).order('em',{ascending:false});
 const L=cache.funcionarios||[];
 modal('Histórico: '+esc(r.nome),error?msg(error):!data.length?'<p class="empty">Ainda não houve retiradas nem devoluções.</p>':data.map(m=>{const f=L.find(x=>x.id===m.funcionario_id);
  return `<div class="mv"><b>${m.tipo}:</b> ${esc(f?f.nome:'—')}<br><span class="hint">${new Date(m.em).toLocaleString('pt-BR')}${m.observacao?' — '+esc(m.observacao):''}</span></div>`}).join(''))}

/* ===== telas ===== */
async function show(name){cur=name;mark();const e=E[name];const v=$('#view');
 v.innerHTML=`<h1>${e.p}</h1><p class="sub" id="sb">Carregando…</p>`;
 try{await loadRefs(e.f);
  const{data,error}=await sb.from(name).select('*').order('criado_em',{ascending:false}).limit(1000);
  if(error)throw error;
  const cols=e.cols.map(k=>e.f.find(f=>f.k===k));
  v.innerHTML=`<h1>${e.p}</h1><p class="sub">${data.length} cadastrado(s)</p><div class="bar"><input id="q" type="search" placeholder="Pesquisar em ${e.p.toLowerCase()}" aria-label="Pesquisar">${canW(e)?`<button class="btn" id="nw">${e.btn}</button>`:''}</div>
  <div class="card wrap">${data.length?`<table><thead><tr>${cols.map(c=>`<th>${c.l}</th>`).join('')}<th></th></tr></thead><tbody>${data.map((r,i)=>`<tr data-i="${i}">${cols.map(c=>`<td>${cell(c,r[c.k])}</td>`).join('')}<td style="white-space:nowrap">${acts(name,r)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">${e.vazio}${canW(e)?`<br>Clique em “${e.btn}” para começar.`:''}</div>`}</div>`;
  if($('#nw'))$('#nw').onclick=()=>form(name);
  if($('#q'))$('#q').oninput=x=>{const t=x.target.value.toLowerCase();v.querySelectorAll('tbody tr').forEach(tr=>tr.classList.toggle('hide',!tr.textContent.toLowerCase().includes(t)))};
  v.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const r=data[b.closest('tr').dataset.i],a=b.dataset.a;
   ({edit:()=>form(name,r),ret:()=>retirar(r),dev:()=>devolver(r),his:()=>hist(r)})[a]()});
 }catch(x){v.innerHTML=`<h1>${e.p}</h1><div class="err">${esc(msg(x))}</div>`}}
function acts(name,r){let h='';
 if(name==='ferramentas'){if(canW(E[name])){if(r.situacao==='Disponível')h+='<button class="mini" data-a="ret">Retirar</button>';if(r.situacao==='Em uso')h+='<button class="mini" data-a="dev">Devolver</button>'}h+='<button class="mini" data-a="his">Histórico</button>'}
 if(canW(E[name]))h+='<button class="mini" data-a="edit">Editar</button>';return h}
async function painel(){cur='painel';mark();const v=$('#view');
 const T=[['obras','Obras'],['funcionarios','Funcionários'],['ferramentas','Ferramentas'],['materiais','Materiais']];
 const n=await Promise.all(T.map(t=>sb.from(t[0]).select('id',{count:'exact',head:true})));
 v.innerHTML=`<h1>Painel</h1><p class="sub">Bem-vindo(a), ${esc(me.nome||'')}. Os números abaixo vêm do banco de dados.</p>
 <div class="kpis">${T.map((t,i)=>`<div class="card kpi"><b>${n[i].count==null?'—':n[i].count}</b>${t[1]}</div>`).join('')}</div>

 me=data;cache={};$('#who').innerHTML=esc(me.nome||me.login)+'<br>'+esc(me.perfil);menu();tela('app');painel()}

 <script>
/* MASTERS GESTÃO - 3B-5d: importar solicitações de materiais (embutido no index.html) */
try{(function(){
if(!window.XLSX&&!document.querySelector('script[data-xls]')){const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.setAttribute('data-xls','1');document.head.appendChild(s)}

const nz=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\*/g,'').toLowerCase().trim().replace(/\s+/g,' ');
const dsc=s=>String(s==null?'':s).toLowerCase().trim().replace(/\s+/g,' ');
const vz=v=>String(v==null?'':v).trim()==='';
const fdt=d=>new Date(d+'T00:00').toLocaleDateString('pt-BR');
const num=v=>{if(typeof v==='number')return v;const s=String(v==null?'':v).trim().replace(/\s/g,'');if(!s)return NaN;
 const t=s.includes(',')?s.replace(/\./g,'').replace(',','.'):s;return /^\d+(\.\d+)?$/.test(t)?Number(t):NaN};

function parseData(v){let y,m,d;
 if(typeof v==='number'){const t=new Date(Math.round((v-25569)*86400000));y=t.getUTCFullYear();m=t.getUTCMonth()+1;d=t.getUTCDate()}
 else{const s=String(v||'').trim();let k=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if(k){d=+k[1];m=+k[2];y=+k[3]}else{k=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(!k)return null;y=+k[1];m=+k[2];d=+k[3]}}
 const t=new Date(Date.UTC(y,m-1,d));
 if(t.getUTCFullYear()!==y||t.getUTCMonth()!==m-1||t.getUTCDate()!==d||y<2000||y>2100)return null;
 return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}

const COLS=[
 {k:'requisicao',h:'Requisição Sienge',req:1,como:'Número da requisição gerado pelo Sienge. Repita o mesmo número em todas as linhas dos materiais dessa requisição.',ex:'(número do Sienge)'},
 {k:'obra',h:'Obra',req:1,como:'Nome ou código de uma obra já cadastrada no sistema.',ex:'(obra cadastrada)'},
 {k:'solicitante',h:'Solicitante',req:0,como:'Nome ou matrícula de um funcionário da obra. Se não for encontrado, a requisição entra sem solicitante e o nome vai para a observação.',ex:'(nome ou matrícula)'},
 {k:'data',h:'Data da solicitação',req:1,como:'Data da solicitação, no formato dia/mês/ano.',ex:'09/11/2026'},
 {k:'aprovacao',h:'Data da aprovação',req:0,como:'Dia/mês/ano. Preencha se o gestor já aprovou a requisição no Sienge. Em branco, entra como “Aguardando aprovação”.',ex:'10/11/2026'},
 {k:'codigo',h:'Código do material',req:0,como:'Código do material, se houver. Se já existir no sistema, o material existente é usado.',ex:'(opcional)'},
 {k:'descricao',h:'Descrição do material',req:1,como:'Descrição do material como está na requisição. Não precisa estar cadastrado antes.',ex:'(descrição do material)'},
 {k:'unidade',h:'Unidade',req:1,como:'Como o material é contado: m, un, cx, kg...',ex:'m'},
 {k:'quantidade',h:'Quantidade',req:1,como:'Número maior que zero. Pode usar vírgula nos decimais.',ex:'10,5'},
 {k:'obs',h:'Observação',req:0,como:'Observação da requisição. Basta preencher em uma das linhas.',ex:'(opcional)'}];
const NOTAS=['Preencha somente a aba “Modelo”, a partir da linha 2. Não altere os nomes das colunas.','Uma linha por material. Repita o número da requisição e os dados da requisição (obra, solicitante, datas) em todas as linhas dela.','Requisições já cadastradas são ignoradas. Nada é sobrescrito nem apagado.','Materiais que ainda não existem são cadastrados automaticamente em Materiais. Isso não cria estoque.','Até 2000 linhas por arquivo.','Você também pode importar direto o relatório “Solicitações de Compra” do Sienge, sem usar este modelo.'];
const ARQ='modelo-solicitacoes';

function modelo(tipo){const H=COLS.map(k=>k.h);
 if(tipo==='csv'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+H.join(';')+'\r\n'],{type:'text/csv;charset=utf-8'}));a.download=ARQ+'.csv';a.click();return}
 if(!window.XLSX){toast('A biblioteca de planilhas ainda está carregando. Tente de novo em instantes.');return}
 const wb=XLSX.utils.book_new(),w1=XLSX.utils.aoa_to_sheet([H]);w1['!cols']=H.map(()=>({wch:26}));XLSX.utils.book_append_sheet(wb,w1,'Modelo');
 const w2=XLSX.utils.aoa_to_sheet([['Coluna','Obrigatória?','Como preencher','Exemplo'],...COLS.map(k=>[k.h,k.req?'Sim':'Não',k.como,k.ex]),[],...NOTAS.map(n=>[n])]);
 w2['!cols']=[{wch:26},{wch:14},{wch:80},{wch:28}];XLSX.utils.book_append_sheet(wb,w2,'Instruções');XLSX.writeFile(wb,ARQ+'.xlsx')}

function csv(t){const L=t.replace(/^\uFEFF/,'').split(/\r?\n/);const f=L[0]||'';const d=f.split(';').length>=f.split(',').length?';':',';
 return L.filter(x=>x.trim()!=='').map(l=>{const o=[];let c='',q=false;
  for(let i=0;i<l.length;i++){const h=l[i];if(q){if(h==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=h}else if(h==='"')q=true;else if(h===d){o.push(c);c=''}else c+=h}
  o.push(c);return o})}
const ROT=['solicitacao','data da solicitacao','data da ultima autorizacao','obra','solicitante','observacoes','insumo'];
function achaSienge(arr,arq){
 let hi=-1;for(let i=0;i<Math.min(arr.length,60);i++){if((arr[i]||[]).some(c=>nz(c)==='insumo')){hi=i;break}}
 if(hi<0)return null;
 const val=lab=>{for(let i=0;i<arr.length;i++){const r=arr[i]||[];for(let j=0;j<r.length;j++){if(nz(r[j])===lab){
   for(let k=j+1;k<r.length;k++){if(vz(r[k]))continue;return ROT.includes(nz(r[k]))?'':r[k]}return ''}}}return ''};
 const H=(arr[hi]||[]).map(nz),pos=n=>H.indexOf(n);
 const pI=pos('insumo'),pA=pos('autorizacao'),pU=pos('und.'),pQ=pos('qtd. prevista');
 if(pU<0||pQ<0)throw new Error('Relatório do Sienge sem as colunas "Und." e "Qtd. prevista".');
 const cab={requisicao:val('solicitacao'),obra:val('obra'),solicitante:val('solicitante'),data:val('data da solicitacao'),obs:val('observacoes')},ult=val('data da ultima autorizacao');
 const its=[];for(let i=hi+1;i<arr.length;i++){const r=arr[i]||[];if(vz(r[pI]))break;its.push({i,r})}
 if(!its.length)throw new Error('Não encontrei materiais abaixo da coluna "Insumo".');
 const nao=its.filter(t=>pA>=0&&nz(t.r[pA])!=='sim');
 const avisos=[];let ap='';
 if(nao.length)avisos.push('Há itens sem autorização "Sim" no Sienge (linhas '+nao.map(t=>t.i+1).join(', ')+'): a requisição entra como aguardando aprovação.');
 else if(vz(ult))avisos.push('Os itens constam como autorizados, mas não há "Data da última autorização": a requisição entra como aguardando aprovação.');
 else ap=ult;
 const rows=its.map((t,n)=>{const ins=String(t.r[pI]).trim(),m=ins.match(/^(\S+)\s+-\s+(.+)$/);
  return{linha:t.i+1,arq,avisos:n===0?avisos:[],v:{...cab,aprovacao:ap,codigo:m?m[1]:'',descricao:m?m[2]:ins,unidade:t.r[pU],quantidade:t.r[pQ]}}});
 const ob=String(cab.obra==null?'':cab.obra).trim(),m2=ob.match(/^(\S+)\s+-\s+(.+)$/);
 rows.forEach(r=>{r.v.obraCodigo=m2?m2[1]:'';r.v.obraNome=m2?m2[2]:ob});
 return rows}

async function ler(file){const n=file.name.toLowerCase();let arr,wbs=null;
 if(n.endsWith('.csv')){const b=await file.arrayBuffer();let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){t=new TextDecoder('windows-1252').decode(b)}arr=csv(t)}
 else if(n.endsWith('.xlsx')){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});wbs=wb.SheetNames.map(k=>XLSX.utils.sheet_to_json(wb.Sheets[k],{header:1,raw:true,defval:''}));
  const mi=wb.SheetNames.indexOf('Modelo');arr=wbs[mi>=0?mi:0]}
 else throw new Error('Use um arquivo .xlsx ou .csv.');
 for(const a of (wbs||[arr])){const sg=achaSienge(a,file.name);if(sg)return sg}
 if(!arr||!arr.length)throw new Error('O arquivo está vazio.');
 const H=arr[0].map(nz),pos={};COLS.forEach(k=>{pos[k.k]=H.indexOf(nz(k.h))});
 const falt=COLS.filter(k=>k.req&&pos[k.k]<0).map(k=>k.h);
 if(falt.length)throw new Error('Arquivo não reconhecido. Use o relatório "Solicitações de Compra" do Sienge ou o modelo do sistema (faltam as colunas: '+falt.join(', ')+').');
 const rows=[];arr.slice(1).forEach((l,i)=>{const v={};COLS.forEach(k=>v[k.k]=pos[k.k]<0?'':l[pos[k.k]]);if(Object.values(v).some(x=>String(x).trim()!==''))rows.push({linha:i+2,arq:file.name,v})});
 if(!rows.length)throw new Error('Não há linhas preenchidas abaixo do cabeçalho.');
 if(rows.length>2000)throw new Error('O arquivo tem mais de 2000 linhas. Divida em arquivos menores.');
 return rows}

async function lerTudo(t,c){let a=[],i=0;for(;;){const{data,error}=await sb.from(t).select(c).order('id').range(i,i+999);if(error)throw error;a=a.concat(data||[]);if(!data||data.length<1000)break;i+=1000}return a}
async function contexto(){const[ob,fu,ma,so]=await Promise.all([lerTudo('obras','id,nome,codigo'),lerTudo('funcionarios','id,nome,matricula,obra_id'),lerTudo('materiais','id,codigo,descricao,unidade'),lerTudo('solicitacoes','id,numero_sienge')]);
 return{obras:ob,func:fu,mat:ma,exist:new Set(so.filter(s=>s.numero_sienge).map(s=>nz(s.numero_sienge)))}}

function reqSol(g,x){const L=g.rows,n=g.n,ls=L.map(r=>r.linha).join(', '),arq=L[0].arq&&x.multi?' · '+L[0].arq:'';
 const base={linha:L[0].linha,num:n,arq:L[0].arq,resumo:'Requisição '+n+arq+' (linha'+(L.length>1?'s ':' ')+ls+')'};
 const rej=m=>({...base,estado:'rej',motivo:m});
 if(x.exist.has(nz(n)))return{...base,estado:'ign',motivo:'Requisição já cadastrada no sistema.'};
 const H={};
 for(const[c,nm] of [['obra','Obra'],['solicitante','Solicitante'],['data','Data da solicitação'],['aprovacao','Data da aprovação']]){
  const vs=L.filter(r=>!vz(r.v[c]));H[c]=vs.length?vs[0].v[c]:null;
  const val=r=>(c==='data'||c==='aprovacao')?(parseData(r.v[c])||String(r.v[c])):nz(r.v[c]);
  const d=vs.find(r=>val(r)!==val(vs[0]));
  if(d)return rej(nm+' diferente entre as linhas '+vs[0].linha+' e '+d.linha+'. Os dados da requisição devem ser iguais em todas as linhas.')}
 const ob=String(H.obra==null?'':H.obra).trim();if(!ob)return rej('Obra não informada.');
 const r0=L[0].v,tent=[ob,r0.obraNome,r0.obraCodigo].filter(t=>!vz(t)).map(nz);
 const f=x.obras.find(a=>tent.includes(nz(a.nome))||tent.includes(nz(a.codigo)));
 if(!f)return rej('Obra "'+ob+'" não encontrada no sistema. Cadastre a obra em Cadastros → Obras com o mesmo nome'+(r0.obraCodigo?' (ou código '+r0.obraCodigo+')':'')+' e importe de novo.');
 if(H.data==null)return rej('Data da solicitação não informada.');
 const d1=parseData(H.data);if(!d1)return rej('Data da solicitação inválida. Use dia/mês/ano.');
 let ap=null;if(H.aprovacao!=null){ap=parseData(H.aprovacao);if(!ap)return rej('Data da aprovação inválida. Use dia/mês/ano.');if(ap<d1)return rej('A data da aprovação é anterior à data da solicitação.')}
 const avisos=[];L.forEach(r=>(r.avisos||[]).forEach(a=>avisos.push(a)));
 let solId=null,obs=(L.find(r=>!vz(r.v.obs))||{v:{}}).v.obs;obs=vz(obs)?'':String(obs).trim();
 const sn=String(H.solicitante==null?'':H.solicitante).trim();
 if(sn){const s=x.func.find(a=>a.obra_id===f.id&&(nz(a.matricula)===nz(sn)||nz(a.nome)===nz(sn)));
  if(s)solId=s.id;else{avisos.push('Solicitante "'+sn+'" não encontrado nesta obra: a requisição entra sem solicitante e o nome vai para a observação.');obs=(obs?obs+' — ':'')+'Solicitante informado na importação: '+sn}}
 const itens=[],vd=new Map(),vc=new Map();let novos=0;
 for(const r of L){const v=r.v,d=String(v.descricao==null?'':v.descricao).trim().replace(/\s+/g,' '),u=String(v.unidade==null?'':v.unidade).trim(),q=num(v.quantidade),cod=String(v.codigo==null?'':v.codigo).trim();
  if(!d)return rej('Linha '+r.linha+': descrição do material não informada.');
  if(!u)return rej('Linha '+r.linha+': unidade não informada.');
  if(!(q>0))return rej('Linha '+r.linha+': quantidade inválida (use um número maior que zero).');
  const kd=dsc(d)+'|'+dsc(u);
  if(vd.has(kd))return rej('Material repetido nas linhas '+vd.get(kd)+' e '+r.linha+'. Some as quantidades em uma linha ou corrija a descrição.');
  vd.set(kd,r.linha);
  let cc=cod||null;const pm=cod?x.mat.find(a=>nz(a.codigo)===nz(cod)):null;
  if(cc&&pm&&!(dsc(pm.descricao)===dsc(d)&&dsc(pm.unidade)===dsc(u))){avisos.push('Código '+cod+' já existe em Materiais como "'+pm.descricao+'" ('+pm.unidade+'): "'+d+'" ('+u+') será cadastrado como outro material, com código automático (linha '+r.linha+').');cc=null}
  else if(cc&&vc.has(nz(cc))){avisos.push('O código '+cod+' aparece em mais de um material desta requisição (linhas '+vc.get(nz(cc))+' e '+r.linha+'): o material da linha '+r.linha+' será cadastrado com código automático.');cc=null}
  if(cc)vc.set(nz(cc),r.linha);
  const m=(cc&&pm)?pm:x.mat.find(a=>dsc(a.descricao)===dsc(d)&&dsc(a.unidade)===dsc(u));
  if(!m)novos++;
  itens.push({codigo:cc,descricao:d,unidade:u,quantidade:q})}
 return{...base,resumo:'Requisição '+n+arq+' — '+f.nome+' — '+itens.length+' item(ns)'+(novos?' ('+novos+' material(is) novo(s) em Materiais)':'')+(ap?' — aprovada em '+fdt(ap):''),
  estado:'novo',motivo:avisos.length?'ATENÇÃO: '+avisos.join(' '):'',
  payload:{linha:L[0].linha,obra_id:f.id,solicitante_id:solId,data:d1,aprovacao:ap,numero:n,obs:obs||null,itens}}}

function validar(rows,x){const out=[],G=new Map();
 rows.forEach(r=>{const n=vz(r.v.requisicao)?'':String(r.v.requisicao).trim();
  if(!n){out.push({linha:r.linha,arq:r.arq,resumo:'Linha '+r.linha+(x.multi&&r.arq?' · '+r.arq:''),estado:'rej',motivo:'Número da requisição não informado.'});return}
  const k=(r.arq||'')+'|'+nz(n);if(!G.has(k))G.set(k,{n,rows:[]});G.get(k).rows.push(r)});
 const vis=new Map();
 G.forEach(g=>{const o=reqSol(g,x);
  if(o.estado==='novo'){const k=nz(g.n);if(vis.has(k)){o.estado='rej';o.motivo='O mesmo número de requisição aparece também no arquivo "'+vis.get(k)+'". Importe só uma vez.';delete o.payload}else vis.set(k,g.rows[0].arq)}
  out.push(o)});
 return out.sort((a,b)=>(a.arq||'').localeCompare(b.arq||'')||a.linha-b.linha)}

const lista=(t,L)=>L&&L.length?'<h3>'+t+'</h3>'+L.map(x=>`<div class="mv">${/^Requisição/.test(x.motivo||'')?'':'Linha '+x.linha+': '}${esc(x.motivo)}</div>`).join(''):'';
const relatorio=d=>`<div class="kpis"><div class="card kpi"><b>${d.importados}</b>Requisições importadas</div><div class="card kpi"><b>${d.itens||0}</b>Itens importados</div><div class="card kpi"><b>${d.ignorados}</b>Ignoradas</div><div class="card kpi al"><b>${d.rejeitados}</b>Rejeitadas</div></div>`+lista('Requisições ignoradas',d.detalhes.ignorados)+lista('Requisições rejeitadas',d.detalhes.rejeitados);

function tela(){cur='imp_solic';mark();const v=$('#view');
 v.innerHTML=`<h1>Importar solicitações de materiais</h1><p class="sub">Nada é gravado antes da sua confirmação.</p>
 <div class="card"><h3 style="margin-top:0">Passo 1: escolha o arquivo</h3>
 <p><b>Opção A (mais fácil):</b> o relatório <b>“Solicitações de Compra”</b> exportado do Sienge, do jeito que ele sai. Você pode escolher <b>vários arquivos de uma vez</b>, um por requisição.</p>
 <p><b>Opção B:</b> a planilha modelo do sistema, com várias requisições. <button class="mini" id="sx_m">Baixar modelo (Excel)</button> <button class="mini" id="sx_c">Baixar modelo (CSV)</button></p>
 <input id="sx_f" type="file" accept=".xlsx,.csv" multiple></div><div id="sx_r" style="margin-top:12px"></div>`;
 $('#sx_m').onclick=()=>modelo();$('#sx_c').onclick=()=>modelo('csv');$('#sx_f').onchange=e=>processar([...e.target.files])}

async function processar(files){const R=$('#sx_r');if(!files||!files.length)return;
 if(!window.XLSX){toast('A biblioteca de planilhas ainda está carregando. Tente de novo em instantes.');return}
 R.innerHTML='<p class="sub">Lendo o arquivo…</p>';
 try{let rows=[];const falhas=[];
  for(const f of files){try{rows=rows.concat(await ler(f))}catch(e){falhas.push({linha:0,arq:f.name,resumo:'Arquivo '+f.name,estado:'rej',motivo:e.message||String(e)})}}
  const x=await contexto();x.multi=files.length>1;
  const res=validar(rows,x).concat(falhas);
  const N=res.filter(a=>a.estado==='novo'),I=res.filter(a=>a.estado==='ign'),J=res.filter(a=>a.estado==='rej'),AV=N.filter(a=>a.motivo).length;
  const lb={novo:'Nova',ign:'Ignorada',rej:'Rejeitada'},cl={novo:'blue',ign:'',rej:'red'};
  const env=a=>({linha:a.linha,motivo:(a.num&&!/^Requisição/.test(a.motivo)?'Requisição '+a.num+': ':'')+(a.arq&&files.length>1?'['+a.arq+'] ':'')+a.motivo});
  R.innerHTML=`<div class="card"><h3 style="margin-top:0">Passo 2: confira a prévia</h3><p>${files.length} arquivo(s) — ${res.length} requisição(ões) encontrada(s)</p>
  <div class="kpis"><div class="card kpi"><b>${N.length}</b>Novas</div><div class="card kpi"><b>${I.length}</b>Ignoradas</div><div class="card kpi al"><b>${J.length}</b>Rejeitadas</div></div>
  <div class="wrap" style="max-height:380px;overflow:auto"><table style="min-width:560px"><thead><tr><th>Requisição</th><th>Situação</th><th>Motivo ou aviso</th></tr></thead><tbody>${res.slice(0,500).map(a=>`<tr><td>${esc(a.resumo)}</td><td><span class="chip ${cl[a.estado]}">${lb[a.estado]}</span></td><td>${esc(a.motivo||'')}</td></tr>`).join('')}</tbody></table></div>${res.length>500?'<p class="hint">Mostrando as 500 primeiras. A importação considera todas.</p>':''}
  ${AV?`<label style="display:flex;gap:10px;align-items:center;margin-top:12px"><input type="checkbox" id="sx_av" style="width:24px;min-height:24px"><span><b>${AV} requisição(ões) com ATENÇÃO.</b> Li os avisos na prévia e confirmo a importação.</span></label>`:''}
  <div class="err hide" id="sx_e"></div><div class="acts"><button class="sec" id="sx_x">Cancelar</button><button class="btn" id="sx_ok" ${N.length&&!AV?'':'disabled'}>Passo 3: importar ${N.length} requisição(ões) nova(s)</button></div></div>`;
  $('#sx_x').onclick=()=>{R.innerHTML='';$('#sx_f').value=''};
  if(AV)$('#sx_av').onchange=e=>{$('#sx_ok').disabled=!e.target.checked||!N.length};
  $('#sx_ok').onclick=async()=>{
   if(!confirm('Importar '+N.length+' requisição(ões) nova(s)?\n'+I.length+' serão ignoradas e '+J.length+' rejeitadas.'))return;
   const b=$('#sx_ok');b.disabled=true;
   const{data,error}=await sb.rpc('importar_solicitacoes',{p_arquivo:files.length>1?files.length+' arquivos ('+files[0].name+', ...)':files[0].name,p_dados:N.map(a=>a.payload),p_rejeitados:J.map(env),p_ignorados:I.map(env)});
   if(error){b.disabled=false;const e=$('#sx_e');e.textContent=msg(error);e.classList.remove('hide');return}
   cache={};R.innerHTML='<div class="card"><h3 style="margin-top:0">Resultado da importação</h3>'+relatorio(data)+'<p class="hint">Confira em “Solicitações e pedidos”. Os materiais novos estão em “Materiais”, marcados para conferência.</p></div>';toast('Importação concluída.')}
 }catch(e){R.innerHTML='<div class="err">'+esc(e.message||msg(e))+'</div>'}}

/* abre a importação e já mostra a janela de escolha de arquivo (chamado direto pelos dois botões) */
function abrir(){tela();const f=document.getElementById('sx_f');if(f)f.click()}

/* botão 1: no menu lateral, logo abaixo de "Solicitações e pedidos" */
function poeMenu(){const m=document.getElementById('menu');if(!m||!me||me.perfil==='FUNCIONARIO'||m.querySelector('[data-v="imp_solic"]'))return;
 const b=document.createElement('button');b.className='nav';b.setAttribute('data-v','imp_solic');b.textContent='Importar solicitações';
 const alvo=[...m.querySelectorAll('button.nav')].find(x=>x.textContent.trim()==='Solicitações e pedidos')||m.querySelector('.nav[data-v="painel"]');
 if(alvo)alvo.insertAdjacentElement('afterend',b);else m.insertBefore(b,m.firstChild);
 if(cur==='imp_solic')b.classList.add('on')}
/* botão 2: dentro da tela Solicitações e pedidos, ao lado de "Nova solicitação" */
function poeBarra(){const v=document.getElementById('view'),h=v&&v.querySelector('h1');
 if(!h||h.textContent.trim()!=='Solicitações e pedidos'||!me||me.perfil==='FUNCIONARIO')return;
 const bar=v.querySelector('.bar');if(!bar||bar.querySelector('#imp_sol_btn'))return;
 const b=document.createElement('button');b.id='imp_sol_btn';b.type='button';b.className='sec';b.setAttribute('data-imp','abrir');b.textContent='Importar solicitações (Sienge)';bar.appendChild(b)}
/* um único tratador de clique para os dois botões; funciona mesmo depois de a tela ser redesenhada */
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('[data-v="imp_solic"],[data-imp="abrir"]');
 if(!t)return;e.stopPropagation();e.preventDefault();
 if(t.getAttribute('data-imp')==='abrir')abrir();else tela()},true);
const _m=menu;menu=function(){_m();poeMenu()};
new MutationObserver(poeMenu).observe(document.getElementById('menu'),{childList:true});
new MutationObserver(poeBarra).observe(document.getElementById('view'),{childList:true,subtree:true});
poeMenu();poeBarra();
/* etiqueta de versão no fim do menu */
document.querySelectorAll('aside .soon').forEach(x=>{if(/^Versão /.test(x.textContent))x.remove()});
const sd=document.getElementById('side');if(sd){const d=document.createElement('div');d.className='soon';d.style.marginTop='14px';d.textContent='Versão 3B-5d';sd.appendChild(d)}

window.__impSolicTeste={ler,validar,parseData,num,achaSienge,abrir};
})()}catch(e){window.__impSolicErro=e;console.error('Importação de solicitações não carregou:',e);
 const av=()=>{const t=document.getElementById('toast');if(t){t.textContent='Importação de solicitações não carregou: '+e.message;t.classList.add('on')}};
 if(document.readyState==='complete')av();else window.addEventListener('load',av)}
</script>
